<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Entanglement: Our End</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-bar">
        <a href="https://www.instagram.com/entanglement_our_end/" target="_blank" rel="noopener" aria-label="Instagram">
            <img src="instagram.png" alt="Instagram" class="social-icon">
        </a>
        <a href="https://www.tiktok.com/@entanglement.our.end" target="_blank" rel="noopener" aria-label="TikTok">
            <img src="tiktok.png" alt="TikTok" class="social-icon">
        </a>
        <a href="https://www.youtube.com/@EntanglementOurEnd" target="_blank" rel="noopener" aria-label="YouTube">
            <img src="youtube.png" alt="YouTube" class="social-icon">
        </a>
    </div>

    <div class="content">
        <img src="logo.png" alt="Logo" class="logo">

        <div class="countdown" id="countdown" data-target="2026-09-08T21:00:00+03:00" role="timer" aria-live="off">
            <div class="unit">
                <span class="value" id="cd-days">00</span>
                <span class="label">Days</span>
            </div>
            <span class="sep" aria-hidden="true">:</span>
            <div class="unit">
                <span class="value" id="cd-hours">00</span>
                <span class="label">Hours</span>
            </div>
            <span class="sep" aria-hidden="true">:</span>
            <div class="unit">
                <span class="value" id="cd-minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <span class="sep" aria-hidden="true">:</span>
            <div class="unit">
                <span class="value" id="cd-seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <h1>Coming Soon</h1>
    </div>

    <div class="bottom-bar">
        <button type="button" class="contact-email" id="contact-email" data-email="yukurostudio@gmail.com" aria-label="Copy email address">
            <span class="email-text">yukurostudio@gmail.com</span>
            <span class="copied-note" aria-hidden="true">Copied!</span>
        </button>
        <span class="sr-only" role="status" aria-live="polite" id="copy-status"></span>
    </div>

    <script>
        (function () {
            const root = document.getElementById('countdown');
            const target = new Date(root.dataset.target).getTime();
            const fields = {
                days: document.getElementById('cd-days'),
                hours: document.getElementById('cd-hours'),
                minutes: document.getElementById('cd-minutes'),
                seconds: document.getElementById('cd-seconds')
            };

            function pad(n, width) {
                return String(n).padStart(width || 2, '0');
            }

            let timer = null;

            function tick() {
                // Recomputed from the clock each tick, so throttled or missed
                // timers on mobile can never make the countdown drift.
                const remaining = Math.max(0, target - Date.now());
                const total = Math.floor(remaining / 1000);

                fields.days.textContent = pad(Math.floor(total / 86400));
                fields.hours.textContent = pad(Math.floor(total / 3600) % 24);
                fields.minutes.textContent = pad(Math.floor(total / 60) % 60);
                fields.seconds.textContent = pad(total % 60);

                if (remaining === 0 && timer !== null) {
                    root.classList.add('is-done');
                    clearInterval(timer);
                    timer = null;
                }
            }

            if (!isNaN(target)) {
                tick();
                timer = setInterval(tick, 1000);

                // Mobile browsers freeze timers for backgrounded tabs; catch up
                // the moment the page is visible again.
                document.addEventListener('visibilitychange', function () {
                    if (!document.hidden) {
                        tick();
                    }
                });
            }
        })();

        (function () {
            const button = document.getElementById('contact-email');
            const status = document.getElementById('copy-status');
            const email = button.dataset.email;
            let resetTimer;

            async function copy() {
                try {
                    await navigator.clipboard.writeText(email);
                    return true;
                } catch (err) {
                    // Fallback for insecure contexts / older browsers
                    const field = document.createElement('textarea');
                    field.value = email;
                    field.setAttribute('readonly', '');
                    field.style.position = 'fixed';
                    field.style.opacity = '0';
                    document.body.appendChild(field);
                    field.select();
                    const ok = document.execCommand('copy');
                    document.body.removeChild(field);
                    return ok;
                }
            }

            button.addEventListener('click', async function () {
                const ok = await copy();
                button.classList.toggle('is-copied', ok);
                status.textContent = ok ? 'Email address copied' : 'Copy failed';
                clearTimeout(resetTimer);
                resetTimer = setTimeout(function () {
                    button.classList.remove('is-copied');
                    status.textContent = '';
                }, 1600);
            });
        })();
    </script>

</body>
</html>

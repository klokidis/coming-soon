<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2b8153">
    <title>Entanglement: Our End</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas class="scene" id="scene" aria-hidden="true"></canvas>
    <canvas class="leaves" id="leaves" aria-hidden="true"></canvas>

    <div class="socials">
        <a href="https://www.instagram.com/entanglement_our_end/" target="_blank" rel="noopener" aria-label="Instagram">
            <img src="instagram.png" alt="Instagram" class="social-icon">
        </a>
        <a href="https://www.tiktok.com/@entanglement.our.end" target="_blank" rel="noopener" aria-label="TikTok">
            <img src="tiktok.png" alt="TikTok" class="social-icon">
        </a>
        <a href="https://www.youtube.com/@EntanglementOurEnd" target="_blank" rel="noopener" aria-label="YouTube">
            <img src="youtube.png" alt="YouTube" class="social-icon">
        </a>
    </div>

    <div class="content">
        <img src="logo.png" alt="Entanglement: Our End" class="logo">

        <div class="video">
            <iframe src="https://www.youtube.com/embed/yCqmoc20dPE" title="Entanglement: Our End" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <a class="wishlist" id="wishlist" href="https://store.steampowered.com/app/5360880/Entanglement_Our_End/" data-app="steam://store/5360880" target="_blank" rel="noopener">
            <img src="steam.png" alt="" class="wishlist-icon">
            <span>Wishlist on Steam</span>
        </a>
    </div>

    <div class="bottom-bar">
        <button type="button" class="contact-email" id="contact-email" data-email="yukurostudio@gmail.com" aria-label="Copy email address">
            <span class="email-text">yukurostudio@gmail.com</span>
            <span class="copied-note" aria-hidden="true">Copied!</span>
        </button>
        <span class="sr-only" role="status" aria-live="polite" id="copy-status"></span>
    </div>

    <script>
        // Forest background: grass, flowers and mushrooms first, then trees sorted by y so the
        // lower ones overlap the ones behind them.
        (function () {
            const canvas = document.getElementById('scene');
            const ctx = canvas.getContext('2d');

            // where the tree actually is inside tree.png (64x96)
            const TREE = { w: 64, h: 96, left: 3, right: 60, top: 7, base: 83 };
            const GRASS = 16;

            function load(src) {
                return new Promise(function (resolve, reject) {
                    const img = new Image();
                    img.onload = function () { resolve(img); };
                    img.onerror = reject;
                    img.src = src;
                });
            }

            // seeded random so the forest looks the same every time
            function rng(seed) {
                return function () {
                    seed = (seed + 0x6d2b79f5) | 0;
                    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            function token(name) {
                return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
            }

            function layout(W, H) {
                const s = token('--tw') / TREE.w;      // pixel-art scale
                const bandY = token('--band-y');
                const bandX = token('--band-x');
                const tw = TREE.w * s;
                const rand = rng(7);
                const jitter = function (n) { return Math.round((rand() * 2 - 1) * n) * s; };
                const trees = [];

                function add(x, y) {
                    trees.push({ x: x, y: Math.round(y) });
                }

                // top and bottom rows, every other row shifted by half a tree
                const stepX = 54 * s;
                const rowStep = 38 * s;
                const startX = Math.round(W / 2 - tw / 2);
                function row(y, k) {
                    const offset = k % 2 ? 27 * s : 0;
                    const n = Math.ceil(W / stepX / 2) + 1;
                    for (let i = -n; i <= n; i++) {
                        add(startX + offset + i * stepX, y);
                    }
                }
                // top rows
                for (let k = 0, base = bandY; base > 0; k++, base -= rowStep) {
                    row(base - TREE.base * s, k);
                }
                // bottom rows
                for (let k = 0, top = H - bandY; top < H; k++, top += rowStep) {
                    row(top - TREE.top * s, k);
                }

                // left and right columns, fitted between the top and bottom
                // rows so the corners don't overlap
                const colStep = 29 * s;
                const firstGround = bandY;
                const lastGround = H - bandY + (TREE.base - TREE.top) * s;
                const n = Math.max(2, Math.round((lastGround - firstGround) / (TREE.h * s * 0.55)));
                const stepY = (lastGround - firstGround) / n;
                for (let k = 0; ; k++) {
                    const inner = bandX - k * colStep;
                    if (inner <= 0) break;
                    const leftX = Math.round(inner - TREE.right * s);
                    const rightX = Math.round(W - inner - TREE.left * s);
                    const shift = k % 2 ? 0.5 : 1;
                    for (let i = shift; i < n; i++) {
                        const y = firstGround + i * stepY - TREE.base * s;
                        add(leftX, y + jitter(3));
                        add(rightX, y + jitter(3));
                    }
                }

                trees.sort(function (a, b) { return a.y - b.y; });

                // ground tiles on a loose grid: grass scattered at random,
                // plus flowers (yellow on the left half, blue on the right)
                // and mushrooms on a staggered grid so they stay evenly spaced
                const ground = [];
                const cell = GRASS * s * 3;
                const DECOR = 4;        // one flower/mushroom per 4x4 cells
                let bag = [];           // 1 mushroom in every 5 decorations
                function nextDecor() {
                    if (!bag.length) {
                        bag = [true, false, false, false, false];
                        for (let i = bag.length - 1; i > 0; i--) {
                            const j = Math.floor(rand() * (i + 1));
                            const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
                        }
                    }
                    return bag.pop();
                }
                for (let j = 0, gy = 0; gy < H; j++, gy += cell) {
                    const stagger = Math.floor(j / DECOR) % 2 ? DECOR / 2 : 0;
                    for (let i = 0, gx = 0; gx < W; i++, gx += cell) {
                        if (j % DECOR === DECOR / 2 && (i + stagger) % DECOR === DECOR / 2) {
                            const half = (cell - GRASS * s) / 2;
                            const x = Math.round(gx + half + jitter(4));
                            const y = Math.round(gy + half + jitter(4));
                            const kind = nextDecor() ? 'mushroom'
                                : x + GRASS * s / 2 < W / 2 ? 'yellow' : 'blue';
                            ground.push({ x: x, y: y, kind: kind });
                        } else if (rand() < 0.55) {
                            ground.push({
                                x: Math.round(gx + rand() * (cell - GRASS * s)),
                                y: Math.round(gy + rand() * (cell - GRASS * s)),
                                kind: 'grass'
                            });
                        }
                    }
                }

                return { s: s, trees: trees, ground: ground };
            }

            function draw(tree, tiles) {
                const W = canvas.clientWidth;
                const H = canvas.clientHeight;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = Math.round(W * dpr);
                canvas.height = Math.round(H * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.imageSmoothingEnabled = false;

                const scene = layout(W, H);
                const s = scene.s;
                scene.ground.forEach(function (g) {
                    ctx.drawImage(tiles[g.kind], g.x, g.y, GRASS * s, GRASS * s);
                });
                scene.trees.forEach(function (t) {
                    ctx.drawImage(tree, Math.round(t.x), Math.round(t.y), TREE.w * s, TREE.h * s);
                });
            }

            Promise.all([
                load('tree.png'), load('grass.png'), load('yellow_flower.png'),
                load('blue_flower.png'), load('mushroom.png')
            ]).then(function (imgs) {
                const tiles = { grass: imgs[1], yellow: imgs[2], blue: imgs[3], mushroom: imgs[4] };
                let frame = 0;
                function redraw() {
                    cancelAnimationFrame(frame);
                    frame = requestAnimationFrame(function () { draw(imgs[0], tiles); });
                }
                redraw();
                window.addEventListener('resize', redraw);
            });

            // Falling leaves, same settings as the particles in the Field scene.
            const leafCanvas = document.getElementById('leaves');
            const leafCtx = leafCanvas.getContext('2d');
            const LEAF = 16;
            const FRAMES = 3;
            const LIFE = 7;
            const SPEED = 0.6;
            const GRAVITY_X = 30;
            const GRAVITY_Y = 20;
            const DEG = Math.PI / 180;
            const FRAME_MS = 1000 / 60 - 1;
            // 100 leaves per 1400x800, like the scene
            const DENSITY = 100 / (1400 * 800);
            // spawn a bit off screen up/left since they drift down/right
            const MARGIN_X = 500;
            const MARGIN_Y = 245;
            const MAX_SCALE = 1.8;

            function between(a, b) {
                return a + Math.random() * (b - a);
            }

            function startLeaves(img) {
                let W = 0, H = 0;   // screen size in game pixels
                let s = 1;
                let k = 1;
                let px = 1;         // leaf pixel size
                let sprites = null; // leafs.png scaled up once
                let f = 1;
                const leaves = [];

                function advance(leaf, dt) {
                    leaf.vx += GRAVITY_X * dt;
                    leaf.vy += GRAVITY_Y * dt;
                    leaf.x += leaf.vx * dt;
                    leaf.y += leaf.vy * dt;
                    leaf.rot += leaf.spin * dt;
                    leaf.age += dt;
                }

                function spawn(leaf, age) {
                    const angle = between(-20, 20) * DEG;
                    const speed = between(20, 60);
                    leaf.x = between(-MARGIN_X, W);
                    leaf.y = between(-MARGIN_Y, H);
                    leaf.vx = Math.cos(angle) * speed;
                    leaf.vy = Math.sin(angle) * speed;
                    leaf.rot = between(0, 360) * DEG;
                    leaf.spin = between(-20, 50) * DEG;
                    leaf.scale = between(0.8, MAX_SCALE);
                    leaf.frame = Math.floor(Math.random() * FRAMES);
                    leaf.age = 0;
                    if (age) advance(leaf, age);
                    return leaf;
                }

                // fade in, stay, fade out
                function alpha(age) {
                    const t = age / LIFE;
                    if (t < 0.18) return t / 0.18;
                    if (t < 0.79) return 1;
                    return (1 - t) / 0.21;
                }

                function resize() {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    const cssW = window.innerWidth;
                    const cssH = window.innerHeight;
                    s = token('--tw') / TREE.w;
                    k = s * dpr;
                    // at least 2x so they're still visible on phones
                    px = Math.max(s, 2) * dpr;
                    W = cssW / s;
                    H = cssH / s;
                    leafCanvas.width = Math.round(cssW * dpr);
                    leafCanvas.height = Math.round(cssH * dpr);

                    f = Math.max(1, Math.ceil(px * MAX_SCALE));
                    sprites = document.createElement('canvas');
                    sprites.width = LEAF * FRAMES * f;
                    sprites.height = LEAF * f;
                    const sctx = sprites.getContext('2d');
                    sctx.imageSmoothingEnabled = false;
                    sctx.drawImage(img, 0, 0, sprites.width, sprites.height);

                    const target = Math.round(DENSITY * (W + MARGIN_X) * (H + MARGIN_Y));
                    // random age so the screen starts full
                    while (leaves.length < target) {
                        leaves.push(spawn({}, Math.random() * LIFE));
                    }
                    leaves.length = target;
                }

                function step(dt) {
                    for (let i = 0; i < leaves.length; i++) {
                        const leaf = leaves[i];
                        advance(leaf, dt);
                        if (leaf.age >= LIFE) spawn(leaf, 0);
                    }
                }

                function render() {
                    const cw = leafCanvas.width;
                    const ch = leafCanvas.height;
                    const reach = LEAF * px * MAX_SCALE;
                    const size = LEAF * f;
                    leafCtx.setTransform(1, 0, 0, 1, 0, 0);
                    leafCtx.clearRect(0, 0, cw, ch);
                    leafCtx.imageSmoothingEnabled = true;
                    for (let i = 0; i < leaves.length; i++) {
                        const leaf = leaves[i];
                        const x = leaf.x * k;
                        const y = leaf.y * k;
                        if (x < -reach || y < -reach || x > cw + reach || y > ch + reach) continue;
                        const scale = leaf.scale * px / f;
                        const cos = Math.cos(leaf.rot) * scale;
                        const sin = Math.sin(leaf.rot) * scale;
                        leafCtx.setTransform(cos, sin, -sin, cos, x, y);
                        leafCtx.globalAlpha = alpha(leaf.age);
                        leafCtx.drawImage(sprites, leaf.frame * size, 0, size, size,
                            -size / 2, -size / 2, size, size);
                    }
                    leafCtx.globalAlpha = 1;
                }

                resize();
                render();

                let resizeFrame = 0;
                window.addEventListener('resize', function () {
                    cancelAnimationFrame(resizeFrame);
                    resizeFrame = requestAnimationFrame(function () {
                        resize();
                        render();
                    });
                });

                // no animation for reduced motion
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

                // capped at 60fps
                let last = performance.now();
                function tick(now) {
                    requestAnimationFrame(tick);
                    const elapsed = now - last;
                    if (elapsed < FRAME_MS) return;
                    last = now;
                    step(Math.min(elapsed / 1000, 0.1) * SPEED);
                    render();
                }
                requestAnimationFrame(tick);
            }

            load('leafs.png').then(startLeaves);
        })();

        // Steam button: on desktop try the Steam client first, and open the
        // store page in the browser if nothing picks up the steam:// link.
        // Phones just follow the https link, the Steam app catches it there.
        (function () {
            const link = document.getElementById('wishlist');
            const appUrl = link.dataset.app;
            const webUrl = link.href;
            const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (mobile) return;

            link.addEventListener('click', function (e) {
                // let ctrl/shift/middle clicks open the store page as usual
                if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
                e.preventDefault();

                let left = false;
                function onLeave() { left = true; }
                window.addEventListener('blur', onLeave, { once: true });
                document.addEventListener('visibilitychange', onLeave, { once: true });

                window.location.href = appUrl;

                setTimeout(function () {
                    window.removeEventListener('blur', onLeave);
                    document.removeEventListener('visibilitychange', onLeave);
                    // the browser kept focus, so Steam didn't open
                    if (left) return;
                    // no 'noopener' feature here, it makes window.open return
                    // null and we need to know if the popup was blocked
                    const tab = window.open(webUrl, '_blank');
                    if (tab) tab.opener = null;
                    else window.location.href = webUrl;
                }, 1200);
            });
        })();

        (function () {
            const button = document.getElementById('contact-email');
            const status = document.getElementById('copy-status');
            const email = button.dataset.email;
            let resetTimer;

            async function copy() {
                try {
                    await navigator.clipboard.writeText(email);
                    return true;
                } catch (err) {
                    // Fallback for insecure contexts / older browsers
                    const field = document.createElement('textarea');
                    field.value = email;
                    field.setAttribute('readonly', '');
                    field.style.position = 'fixed';
                    field.style.opacity = '0';
                    document.body.appendChild(field);
                    field.select();
                    const ok = document.execCommand('copy');
                    document.body.removeChild(field);
                    return ok;
                }
            }

            button.addEventListener('click', async function () {
                const ok = await copy();
                button.classList.toggle('is-copied', ok);
                status.textContent = ok ? 'Email address copied' : 'Copy failed';
                clearTimeout(resetTimer);
                resetTimer = setTimeout(function () {
                    button.classList.remove('is-copied');
                    status.textContent = '';
                }, 1600);
            });
        })();
    </script>

</body>
</html>
